name: Single-Pair Strategy Matrix Backtest

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Trading Pair Symbol (e.g. BTC_USDT, ETH_USDT, XAG_USDT)"
        required: true
        default: "BTC_USDT"
        type: string

      start_date:
        description: "Start Date (YYYY-MM-DD)"
        required: true
        default: "2026-01-01"
        type: string

      end_date:
        description: "End Date (YYYY-MM-DD)"
        required: true
        default: "2026-08-31"
        type: string

      strategy:
        description: "Strategy"
        required: true
        default: "ORDER_BLOCK_DEMAND"
        type: choice
        options:
          - "ORDER_BLOCK_DEMAND"
          - "ML_1M_MODEL"
          - "STOCH_RSI"
          - "SMART_STRATEGY"

      capital:
        description: "Initial Capital in USDT"
        required: true
        default: "100.0"
        type: string

      leverage:
        description: "Leverage Multiplier"
        required: true
        default: "10"
        type: string

      margin_pct:
        description: "Margin Allocation % per trade (quantity = margin * leverage)"
        required: true
        default: "10.0"
        type: string

jobs:
  matrix-worker:
    name: Worker ${{ matrix.worker_id }}-${{ matrix.tag }} (${{ inputs.symbol }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1m Split (6 workers):
          # Fee 0 (Maker 0.02% / Taker 0.05%)
          - worker_id: "w01"
            tag: "1m_f0_s1-3"
            timeframes: "1m"
            fee_indices: "0"
            slippage_ticks: "1,2,3"
          - worker_id: "w02"
            tag: "1m_f0_s4-7"
            timeframes: "1m"
            fee_indices: "0"
            slippage_ticks: "4,5,6,7"
          # Fee 1 (Maker 0.00% / Taker 0.01%)
          - worker_id: "w03"
            tag: "1m_f1_s1-3"
            timeframes: "1m"
            fee_indices: "1"
            slippage_ticks: "1,2,3"
          - worker_id: "w04"
            tag: "1m_f1_s4-7"
            timeframes: "1m"
            fee_indices: "1"
            slippage_ticks: "4,5,6,7"
          # Fee 2 (Maker 0.10% / Taker 0.10%)
          - worker_id: "w05"
            tag: "1m_f2_s1-3"
            timeframes: "1m"
            fee_indices: "2"
            slippage_ticks: "1,2,3"
          - worker_id: "w06"
            tag: "1m_f2_s4-7"
            timeframes: "1m"
            fee_indices: "2"
            slippage_ticks: "4,5,6,7"

          # 5m Split (3 workers):
          # Fee 0 (Maker 0.02% / Taker 0.05%)
          - worker_id: "w07"
            tag: "5m_f0"
            timeframes: "5m"
            fee_indices: "0"
            slippage_ticks: "1,2,3,4,5,6,7"
          # Fee 1 (Maker 0.00% / Taker 0.01%)
          - worker_id: "w08"
            tag: "5m_f1"
            timeframes: "5m"
            fee_indices: "1"
            slippage_ticks: "1,2,3,4,5,6,7"
          # Fee 2 (Maker 0.10% / Taker 0.10%)
          - worker_id: "w09"
            tag: "5m_f2"
            timeframes: "5m"
            fee_indices: "2"
            slippage_ticks: "1,2,3,4,5,6,7"

          # Higher Timeframes (1 worker): 15m, 1h, 4h, 1d (all fees & slippages)
          - worker_id: "w10"
            tag: "htf_all"
            timeframes: "15m,1h,4h,1d"
            fee_indices: "0,1,2"
            slippage_ticks: "1,2,3,4,5,6,7"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests websockets; fi

      - name: Cache Historical Market Data
        uses: actions/cache@v4
        with:
          path: BACKTESTER/OHLCV_Data_Binance
          key: worker-data-${{ inputs.symbol }}-${{ matrix.tag }}-${{ inputs.start_date }}-${{ inputs.end_date }}
          restore-keys: |
            worker-data-${{ inputs.symbol }}-${{ matrix.tag }}-
            worker-data-${{ inputs.symbol }}-
            worker-data-

      - name: Execute Worker Sweep
        run: |
          python BACKTESTER/run_batch.py \
            --symbol "${{ inputs.symbol }}" \
            --timeframes "${{ matrix.timeframes }}" \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            --strategy "${{ inputs.strategy }}" \
            --capital "${{ inputs.capital }}" \
            --leverage "${{ inputs.leverage }}" \
            --margin-pct "${{ inputs.margin_pct }}" \
            --fee-indices "${{ matrix.fee_indices }}" \
            --slippage-ticks "${{ matrix.slippage_ticks }}" \
            --tag "${{ matrix.tag }}"

      - name: Upload Worker Chunk Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ inputs.symbol }}-${{ matrix.tag }}
          path: |
            BACKTESTER/reports/${{ inputs.symbol }}_${{ matrix.tag }}_batch_matrix.csv
            BACKTESTER/reports/${{ inputs.symbol }}_${{ matrix.tag }}_batch_matrix.md
            BACKTESTER/reports/${{ inputs.symbol }}_${{ matrix.tag }}_trades.csv
          if-no-files-found: warn
          retention-days: 14

  consolidate:
    name: Consolidate ${{ inputs.symbol }} Reports
    needs: matrix-worker
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests websockets; fi

      - name: Download All Worker Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-${{ inputs.symbol }}-*
          path: BACKTESTER/reports/
          merge-multiple: true

      - name: Run Master Consolidation
        run: |
          python BACKTESTER/run_batch.py \
            --consolidate \
            --symbol "${{ inputs.symbol }}" \
            --reports-dir BACKTESTER/reports

      - name: Upload Final Consolidated Report Package
        uses: actions/upload-artifact@v4
        with:
          name: complete-reports-${{ inputs.symbol }}-${{ inputs.strategy }}-run${{ github.run_id }}
          path: |
            BACKTESTER/reports/${{ inputs.symbol }}_batch_matrix.csv
            BACKTESTER/reports/${{ inputs.symbol }}_batch_matrix.md
            BACKTESTER/reports/${{ inputs.symbol }}_all_trades.csv
            BACKTESTER/reports/${{ inputs.symbol }}_*_trades.csv
            BACKTESTER/reports/${{ inputs.symbol }}_*_batch_matrix.csv
          if-no-files-found: warn
          retention-days: 30
