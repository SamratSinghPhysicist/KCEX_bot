name: Single-Pair Strategy Matrix Backtest

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Trading Pair Symbol (e.g. BTC_USDT, ETH_USDT, XAG_USDT)"
        required: true
        default: "BTC_USDT"
        type: string

      start_date:
        description: "Start Date (YYYY-MM-DD)"
        required: true
        default: "2026-01-01"
        type: string

      end_date:
        description: "End Date (YYYY-MM-DD)"
        required: true
        default: "2026-08-31"
        type: string

      strategy:
        description: "Strategy"
        required: true
        default: "ORDER_BLOCK_DEMAND"
        type: choice
        options:
          - "ORDER_BLOCK_DEMAND"
          - "ML_1M_MODEL"
          - "STOCH_RSI"
          - "SMART_STRATEGY"

      capital:
        description: "Initial Capital in USDT"
        required: true
        default: "100.0"
        type: string

      leverage:
        description: "Leverage Multiplier"
        required: true
        default: "10"
        type: string

      margin_pct:
        description: "Margin Allocation % per trade (quantity = margin * leverage)"
        required: true
        default: "10.0"
        type: string

jobs:
  matrix-worker:
    name: Worker ${{ matrix.tf_label }} (${{ inputs.symbol }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tf_label: "1m"
            timeframes: "1m"
          - tf_label: "5m"
            timeframes: "5m"
          - tf_label: "15m-1h"
            timeframes: "15m,1h"
          - tf_label: "4h-1d"
            timeframes: "4h,1d"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests websockets; fi

      - name: Cache Historical Market Data
        uses: actions/cache@v4
        with:
          path: |
            BACKTESTER/OHLCV_Data_Binance
            BACKTESTER/Historical_Trades_Data_Binance
          key: worker-data-${{ inputs.symbol }}-${{ matrix.tf_label }}-${{ inputs.start_date }}-${{ inputs.end_date }}
          restore-keys: |
            worker-data-${{ inputs.symbol }}-${{ matrix.tf_label }}-
            worker-data-${{ inputs.symbol }}-
            worker-data-

      - name: Execute Worker Timeframe Sweep
        run: |
          python BACKTESTER/run_batch.py \
            --symbol "${{ inputs.symbol }}" \
            --timeframes "${{ matrix.timeframes }}" \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            --strategy "${{ inputs.strategy }}" \
            --capital "${{ inputs.capital }}" \
            --leverage "${{ inputs.leverage }}" \
            --margin-pct "${{ inputs.margin_pct }}" \
            --tag "${{ matrix.tf_label }}"

      - name: Upload Worker Chunk Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ inputs.symbol }}-${{ matrix.tf_label }}
          path: |
            BACKTESTER/reports/${{ inputs.symbol }}_${{ matrix.tf_label }}_batch_matrix.csv
            BACKTESTER/reports/${{ inputs.symbol }}_${{ matrix.tf_label }}_batch_matrix.md
            BACKTESTER/reports/${{ inputs.symbol }}_${{ matrix.tf_label }}_trades.csv
          if-no-files-found: warn
          retention-days: 14

  consolidate:
    name: Consolidate ${{ inputs.symbol }} Reports
    needs: matrix-worker
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download All Worker Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-${{ inputs.symbol }}-*
          path: BACKTESTER/reports/
          merge-multiple: true

      - name: Run Master Consolidation
        run: |
          python BACKTESTER/run_batch.py \
            --consolidate \
            --symbol "${{ inputs.symbol }}" \
            --reports-dir BACKTESTER/reports

      - name: Upload Final Consolidated Report Package
        uses: actions/upload-artifact@v4
        with:
          name: complete-reports-${{ inputs.symbol }}-${{ inputs.strategy }}-run${{ github.run_id }}
          path: |
            BACKTESTER/reports/${{ inputs.symbol }}_batch_matrix.csv
            BACKTESTER/reports/${{ inputs.symbol }}_batch_matrix.md
            BACKTESTER/reports/${{ inputs.symbol }}_all_trades.csv
            BACKTESTER/reports/${{ inputs.symbol }}_*_trades.csv
            BACKTESTER/reports/${{ inputs.symbol }}_*_batch_matrix.csv
          if-no-files-found: warn
          retention-days: 30
