name: Run Strategy Backtest

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Trading Pair Symbol (e.g. TRUMP_USDT, DOGE_USDT, BTC_USDT)"
        required: true
        default: "TRUMP_USDT"
        type: string

      timeframe:
        description: "Candle Timeframe"
        required: true
        default: "1m"
        type: choice
        options:
          - "1m"
          - "3m"
          - "5m"
          - "15m"
          - "30m"
          - "1h"
          - "2h"
          - "4h"
          - "6h"
          - "8h"
          - "12h"
          - "1d"

      strategy:
        description: "Strategy"
        required: true
        default: "STOCH_RSI"
        type: choice
        options:
          - "STOCH_RSI"
          - "EMA_CROSSOVER"

      ema_preset:
        description: "EMA Preset (if EMA_CROSSOVER)"
        required: false
        default: "5/13"
        type: choice
        options:
          - "5/13"
          - "9/21"
          - "3/8"

      stoch_preset:
        description: "Stoch Preset (if STOCH_RSI)"
        required: false
        default: "FAST_SCALP"
        type: choice
        options:
          - "FAST_SCALP"
          - "STANDARD"
          - "MICRO_BURST"

      start_date:
        description: "Start Date (YYYY-MM-DD)"
        required: true
        default: "2026-01-01"
        type: string

      end_date:
        description: "End Date (YYYY-MM-DD)"
        required: true
        default: "2026-08-31"
        type: string

      use_ticks:
        description: "Enable High-Fidelity Millisecond Tick Trades"
        required: true
        default: true
        type: boolean

      fee_mode:
        description: "Fee Schedule Mode (LIVE = KCEX API, ZERO = 0%, MANUAL = custom)"
        required: true
        default: "LIVE"
        type: choice
        options:
          - "LIVE"
          - "ZERO"
          - "MANUAL"

      maker_fee:
        description: "Custom Maker Fee % (if MANUAL, e.g. 0.0 or 0.02)"
        required: false
        default: "0.0"
        type: string

      taker_fee:
        description: "Custom Taker Fee % (if MANUAL, e.g. 0.0 or 0.05)"
        required: false
        default: "0.0"
        type: string

      volume_mode:
        description: "Trade Volume Mode (CONTRACTS, MULTIPLIER, MIN)"
        required: true
        default: "MULTIPLIER"
        type: choice
        options:
          - "MULTIPLIER"
          - "CONTRACTS"
          - "MIN"

      volume_contracts:
        description: "Number of Contracts per trade (if CONTRACTS mode, e.g. 2, 5, 10)"
        required: false
        default: "2"
        type: string

      volume_multiplier:
        description: "Volume Multiplier (if MULTIPLIER mode, e.g. 2.0 for TRUMP 2x min, 1.0 for DOGE 1x min)"
        required: false
        default: "2.0"
        type: string

      tp_ticks:
        description: "Take Profit in ticks (pu away from entry)"
        required: true
        default: "2"
        type: string

      sl_mode:
        description: "Stop Loss Mode"
        required: true
        default: "ROE"
        type: choice
        options:
          - "ROE"
          - "TICKS"
          - "PRICE_PCT"

      sl_ticks:
        description: "Stop Loss distance in ticks (if TICKS mode)"
        required: false
        default: "10"
        type: string

      sl_roe:
        description: "Stop Loss ROE % on Margin (if ROE mode)"
        required: false
        default: "25.0"
        type: string

      leverage:
        description: "Leverage Multiplier"
        required: true
        default: "75"
        type: string

      capital:
        description: "Initial Capital in USDT"
        required: true
        default: "100.0"
        type: string

      max_trades:
        description: "Max Trades Limit (0 = entire period)"
        required: false
        default: "0"
        type: string

      slippage:
        description: "Slippage in ticks"
        required: false
        default: "0"
        type: string

jobs:
  run-backtest:
    name: Backtest ${{ inputs.symbol }} (${{ inputs.strategy }} ${{ inputs.timeframe }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests websockets; fi

      - name: Cache Historical Market Data
        uses: actions/cache@v4
        with:
          path: |
            BACKTESTER/OHLCV_Data_Binance
            BACKTESTER/Historical_Trades_Data_Binance
          key: market-data-${{ inputs.symbol }}-${{ inputs.timeframe }}-${{ inputs.start_date }}-${{ inputs.end_date }}-${{ inputs.use_ticks }}
          restore-keys: |
            market-data-${{ inputs.symbol }}-${{ inputs.timeframe }}-
            market-data-${{ inputs.symbol }}-
            market-data-

      - name: Prepare Historical Market Data
        run: |
          TICKS_FLAG="--ticks"
          if [ "${{ inputs.use_ticks }}" != "true" ]; then
            TICKS_FLAG="--no-ticks"
          fi
          python BACKTESTER/engine/downloader.py \
            --symbol "${{ inputs.symbol }}" \
            --timeframe "${{ inputs.timeframe }}" \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            $TICKS_FLAG

      - name: Execute Backtest
        run: |
          # Clean any stale report files so only this run's artifacts are produced
          rm -f BACKTESTER/reports/*.csv BACKTESTER/reports/*.jsonl BACKTESTER/reports/*.md

          TICKS_FLAG="--ticks"
          if [ "${{ inputs.use_ticks }}" != "true" ]; then
            TICKS_FLAG="--no-ticks"
          fi

          python BACKTESTER/run_backtest.py \
            --symbol "${{ inputs.symbol }}" \
            --timeframe "${{ inputs.timeframe }}" \
            --strategy "${{ inputs.strategy }}" \
            --ema-preset "${{ inputs.ema_preset }}" \
            --stoch-preset "${{ inputs.stoch_preset }}" \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            $TICKS_FLAG \
            --fee-mode "${{ inputs.fee_mode }}" \
            --maker-fee "${{ inputs.maker_fee }}" \
            --taker-fee "${{ inputs.taker_fee }}" \
            --volume-mode "${{ inputs.volume_mode }}" \
            --contracts "${{ inputs.volume_contracts }}" \
            --volume-multiplier "${{ inputs.volume_multiplier }}" \
            --tp-ticks "${{ inputs.tp_ticks }}" \
            --sl-mode "${{ inputs.sl_mode }}" \
            --sl-ticks "${{ inputs.sl_ticks }}" \
            --sl-roe "${{ inputs.sl_roe }}" \
            --leverage "${{ inputs.leverage }}" \
            --capital "${{ inputs.capital }}" \
            --max-trades "${{ inputs.max_trades }}" \
            --slippage "${{ inputs.slippage }}"

      - name: Publish Summary to GitHub Job Summary
        if: always()
        run: |
          SUMMARY_FILE=$(ls -t BACKTESTER/reports/*_summary.md 2>/dev/null | head -n 1)
          if [ -f "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 📊 Backtest Results" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ No summary markdown report generated. The run may have encountered an execution failure or data error." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Generated Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ inputs.symbol }}-${{ inputs.strategy }}-${{ inputs.timeframe }}-${{ inputs.leverage }}x-tp${{ inputs.tp_ticks }}pu-sl${{ inputs.sl_mode }}${{ inputs.sl_mode == 'ROE' && inputs.sl_roe || inputs.sl_ticks }}-run${{ github.run_id }}
          path: |
            BACKTESTER/reports/*.csv
            BACKTESTER/reports/*.jsonl
            BACKTESTER/reports/*.md
          if-no-files-found: warn
          retention-days: 30
