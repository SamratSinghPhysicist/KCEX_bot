name: Quantitative Backtest Suite

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: backtest-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-backtests:
    name: Execute Full Backtest Suite
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository full source code and data files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11 runtime environment with pip caching
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Step 3: Install project dependencies from requirements.txt or fallback list
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy matplotlib ta scipy requests yfinance
          fi

      # Step 4: Execute the complete back-test suite sequentially across Scenarios A through E
      - name: Execute full back‑test suite
        run: python -u experiments/run_full_backtest.py

      # Step 5: Upload captured console output log as an artifact named backtest_output.txt
      - name: Upload backtest output log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest_output.txt
          path: backtest_output.txt
          if-no-files-found: warn

      # Step 6: Upload all scenario CSV result files from results/ as a single artifact called backtest_results
      - name: Upload backtest CSV results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest_results
          path: results/
          if-no-files-found: warn
