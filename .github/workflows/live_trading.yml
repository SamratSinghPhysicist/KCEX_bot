name: KCEX Live Trading Engine

on:
  schedule:
    # 6 runs per day, 4 hours apart (UTC)
    # IST equivalent: 05:30, 09:30, 13:30, 17:30, 21:30, 01:30
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution Mode (live or dry-run)"
        required: false
        default: "live"
        type: choice
        options:
          - live
          - dry-run
      preset:
        description: "Strategy Preset (e.g. TRUMP_STOCH_RSI, TRUMP_ML_RAPID_SCALPER or CUSTOM)"
        required: false
        default: "TRUMP_STOCH_RSI"
        type: choice
        options:
          - TRUMP_STOCH_RSI
          - TRUMP_ML_RAPID_SCALPER
          - DOGE_ML_MOMENTUM
          - TRUMP_ORDER_BLOCK_DEMAND
          - DOGE_ORDER_BLOCK_DEMAND
          - CUSTOM
      strategy:
        description: "Strategy Engine (used if CUSTOM preset)"
        required: false
        default: "STOCH_RSI"
        type: choice
        options:
          - STOCH_RSI
          - ML_1M_MODEL
          - ORDER_BLOCK_DEMAND
          - EMA_CROSSOVER
          - SMART_STRATEGY
      symbol:
        description: "Trading pair symbol"
        required: false
        default: "TRUMP_USDT"
        type: string
      tp_ticks:
        description: "Take-Profit distance in price unit ticks (Fixed if not ML)"
        required: false
        default: "2"
        type: string
      sl_ticks:
        description: "Stop-Loss distance in price unit ticks (Fixed if not ML)"
        required: false
        default: "150"
        type: string
      invert_signal:
        description: "Signal Paradigm: Direct signal (Momentum)"
        required: false
        default: false
        type: boolean
      execution_style:
        description: "Execution style (PURE_MARKET or MAKER_HYBRID)"
        required: false
        default: "PURE_MARKET"
        type: choice
        options:
          - PURE_MARKET
          - MAKER_HYBRID
      volume_multiplier:
        description: "Volume multiplier (e.g. 50.0 for 50x min quantity)"
        required: false
        default: "50.0"
        type: string
      leverage:
        description: "Position leverage (Isolated margin, default 10x)"
        required: false
        default: "10"
        type: string
      cooldown_seconds:
        description: "Cooldown seconds between trades"
        required: false
        default: "0"
        type: string
      enable_ratchet:
        description: "Enable Micro-Excursion Tick Ratchet"
        required: false
        default: false
        type: boolean
      runtime_hours:
        description: "Session runtime limit in hours (default: 3.5h)"
        required: false
        default: "3.5"
        type: string
      max_trades:
        description: "Session trade target (0 = unlimited)"
        required: false
        default: "0"
        type: string

jobs:
  live-trade:
    name: "🔴 Live Trading (${{ inputs.preset || 'TRUMP_STOCH_RSI' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4h hard cap (buffer beyond 3.5h for trade completion + logging)

    steps:
      - name: "📦 Checkout Code"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.13"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: "📥 Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "🔒 Validate Required Secrets"
        run: |
          MODE="${{ inputs.mode || 'live' }}"
          if [ "${MODE}" = "live" ] && [ -z "${{ secrets.KCEX_AUTH_TOKEN }}" ]; then
            echo "::error::❌ Missing KCEX_AUTH_TOKEN secret in GitHub Repository Settings! Please go to Repo Settings -> Secrets and variables -> Actions and add KCEX_AUTH_TOKEN."
            exit 1
          fi
          echo "✅ Authentication secret check passed."

      - name: "🚀 Run KCEX Trading Engine"
        env:
          KCEX_AUTH_TOKEN: ${{ secrets.KCEX_AUTH_TOKEN }}
          KCEX_USER_DEVICE: ${{ secrets.KCEX_USER_DEVICE }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          echo "::group::🔧 Engine Configuration"
          MODE="${{ inputs.mode || 'live' }}"
          PRESET="${{ inputs.preset || 'TRUMP_STOCH_RSI' }}"
          STRATEGY="${{ inputs.strategy || 'STOCH_RSI' }}"
          SYMBOL="${{ inputs.symbol || 'TRUMP_USDT' }}"
          TP_TICKS="${{ inputs.tp_ticks || '2' }}"
          SL_TICKS="${{ inputs.sl_ticks || '150' }}"
          VOL_MULT="${{ inputs.volume_multiplier || '50.0' }}"
          LEVERAGE="${{ inputs.leverage || '10' }}"
          COOLDOWN="${{ inputs.cooldown_seconds || '0' }}"
          MAX_TRADES="${{ inputs.max_trades || '0' }}"
          EXEC_STYLE="${{ inputs.execution_style || 'PURE_MARKET' }}"
          RUNTIME_HOURS="${{ inputs.runtime_hours || '3.5' }}"
          RUNTIME_SECONDS=$(python -c "print(int(float('${RUNTIME_HOURS}') * 3600))")

          # Signal Paradigm: Direct (default false) vs Inverted
          INVERT_FLAG="--no-invert-signal"
          if [ "${{ inputs.invert_signal }}" = "true" ]; then
            INVERT_FLAG="--invert-signal"
          fi

          # Tick Ratchet: Disabled (default false) vs Enabled
          RATCHET_FLAG="--no-ratchet"
          if [ "${{ inputs.enable_ratchet }}" = "true" ]; then
            RATCHET_FLAG="--ratchet"
          fi

          # Dynamic TP for ML vs Fixed TP for heuristic strategies
          TP_FLAG="--fixed-tp"
          if [ "${STRATEGY}" = "ML_1M_MODEL" ] || [ "${PRESET}" = "TRUMP_ML_RAPID_SCALPER" ] || [ "${PRESET}" = "DOGE_ML_MOMENTUM" ]; then
            TP_FLAG="--dynamic-tp"
          fi

          echo "Execution Mode:    ${MODE}"
          echo "Preset:            ${PRESET}"
          echo "Symbol:            ${SYMBOL}"
          echo "Strategy Engine:   ${STRATEGY}"
          echo "Direction:         Autonomous (Bi-Directional)"
          echo "Signal Paradigm:   ${INVERT_FLAG}"
          echo "Execution Style:   ${EXEC_STYLE}"
          echo "Take Profit:       +${TP_TICKS} pu ticks (${TP_FLAG})"
          echo "Stop Loss:         -${SL_TICKS} ticks"
          echo "Position Volume:   ${VOL_MULT}x min quantity"
          echo "Leverage:          ${LEVERAGE}x isolated"
          echo "Cooldown:          ${COOLDOWN}s"
          echo "Ratchet:           ${RATCHET_FLAG}"
          echo "Slippage Engine:   --disable-slippage"
          echo "Max Trades:        ${MAX_TRADES} (0 = unlimited)"
          echo "Runtime Limit:     ${RUNTIME_HOURS}h (${RUNTIME_SECONDS}s)"
          echo "Environment:       GitHub Actions (Run #${{ github.run_number }})"
          echo "::endgroup::"

          echo "::notice::🚀 Starting ${MODE^^} trading session: ${PRESET} (${SYMBOL}) | Style: ${EXEC_STYLE} | Runtime: ${RUNTIME_HOURS}h"

          if [ "${PRESET}" != "CUSTOM" ]; then
            python run_engine.py \
              --non-interactive \
              --mode "${MODE}" \
              --preset "${PRESET}" \
              --execution-style "${EXEC_STYLE}" \
              --volume-multiplier "${VOL_MULT}" \
              --max-trades "${MAX_TRADES}" \
              --runtime-limit "${RUNTIME_SECONDS}" \
              --mongodb-uri "${MONGODB_URI}"
          else
            python run_engine.py \
              --non-interactive \
              --mode "${MODE}" \
              --symbol "${SYMBOL}" \
              --strategy "${STRATEGY}" \
              --stoch-preset FAST_SCALP \
              --bi-directional \
              ${INVERT_FLAG} \
              --volume-mode MULTIPLIER \
              --volume-multiplier "${VOL_MULT}" \
              --tp-ticks "${TP_TICKS}" \
              ${TP_FLAG} \
              --sl-mode TICKS \
              --sl-ticks "${SL_TICKS}" \
              --leverage "${LEVERAGE}" \
              --execution-style "${EXEC_STYLE}" \
              ${RATCHET_FLAG} \
              --disable-slippage \
              --cooldown "${COOLDOWN}" \
              --max-trades "${MAX_TRADES}" \
              --runtime-limit "${RUNTIME_SECONDS}" \
              --mongodb-uri "${MONGODB_URI}"
          fi

          echo "::notice::✅ Trading session completed"

      - name: "📊 Session Summary"
        if: always()
        run: |
          echo "## 📊 Session Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "logs/trade_outcomes.txt" ]; then
            echo "### Trade Outcomes Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 logs/trade_outcomes.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "> No trade outcomes recorded in this session." >> $GITHUB_STEP_SUMMARY
          fi

      - name: "📁 Upload Session Logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-session-${{ inputs.preset || 'TRUMP_STOCH_RSI' }}-run${{ github.run_number }}-${{ github.run_id }}
          path: |
            logs/*.log
            logs/*.txt
            logs/*.jsonl
          if-no-files-found: warn
          retention-days: 90
