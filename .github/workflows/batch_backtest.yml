name: Multi-Asset Strategy Matrix Backtest

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Trading Pair Symbol(s) (comma-separated e.g. 'BTC_USDT,XAU_USDT' or 'ALL')"
        required: true
        default: "ALL"
        type: string

      start_date:
        description: "Start Date (YYYY-MM-DD)"
        required: true
        default: "2026-01-01"
        type: string

      end_date:
        description: "End Date (YYYY-MM-DD)"
        required: true
        default: "2026-08-31"
        type: string

      strategy:
        description: "Strategy"
        required: true
        default: "ORDER_BLOCK_DEMAND"
        type: choice
        options:
          - "ORDER_BLOCK_DEMAND"
          - "ML_1M_MODEL"
          - "STOCH_RSI"
          - "SMART_STRATEGY"

      capital:
        description: "Initial Capital in USDT"
        required: true
        default: "100.0"
        type: string

      leverage:
        description: "Leverage Multiplier"
        required: true
        default: "10"
        type: string

      margin_pct:
        description: "Margin Allocation % per trade (quantity = margin * leverage)"
        required: true
        default: "10.0"
        type: string

      timeframes:
        description: "Timeframes (comma-separated, 1m & 5m use ticks, higher use OHLCV)"
        required: true
        default: "1m,5m,15m,1h,4h,1d"
        type: string

jobs:
  matrix-backtest:
    name: Matrix ${{ matrix.symbol }} (${{ inputs.strategy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symbol:
          - "BTC_USDT"
          - "XAU_USDT"
          - "ETH_USDT"
          - "SOL_USDT"
          - "DOGE_USDT"
          - "TRUMP_USDT"
          - "1000000MOG_USDT"
          - "CL_USDT"

    steps:
      - name: Check if symbol should run
        id: check-run
        run: |
          TARGET="${{ inputs.symbols }}"
          SYM="${{ matrix.symbol }}"
          SYM_BASE="${SYM%_USDT}"
          SYM_NO_M="${SYM#1000000}"
          if [ "$TARGET" = "ALL" ] || [ "$TARGET" = "all" ] || [[ "$TARGET" =~ "$SYM" ]] || [[ "$TARGET" =~ "$SYM_BASE" ]] || [[ "$TARGET" =~ "$SYM_NO_M" ]]; then
            echo "run_job=true" >> $GITHUB_OUTPUT
            echo "Running backtests for $SYM"
          else
            echo "run_job=false" >> $GITHUB_OUTPUT
            echo "Skipping $SYM (not in target list: $TARGET)"
          fi

      - name: Checkout Code
        if: steps.check-run.outputs.run_job == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        if: steps.check-run.outputs.run_job == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies
        if: steps.check-run.outputs.run_job == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests websockets; fi

      - name: Cache Historical Market Data
        if: steps.check-run.outputs.run_job == 'true'
        uses: actions/cache@v4
        with:
          path: |
            BACKTESTER/OHLCV_Data_Binance
            BACKTESTER/Historical_Trades_Data_Binance
          key: batch-data-${{ matrix.symbol }}-${{ inputs.start_date }}-${{ inputs.end_date }}
          restore-keys: |
            batch-data-${{ matrix.symbol }}-
            batch-data-

      - name: Execute Batch Backtest Matrix
        if: steps.check-run.outputs.run_job == 'true'
        run: |
          # Clean previous report artifacts for this symbol
          rm -f BACKTESTER/reports/${{ matrix.symbol }}_batch_matrix.*

          python BACKTESTER/run_batch.py \
            --symbol "${{ matrix.symbol }}" \
            --timeframes "${{ inputs.timeframes }}" \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            --strategy "${{ inputs.strategy }}" \
            --capital "${{ inputs.capital }}" \
            --leverage "${{ inputs.leverage }}" \
            --margin-pct "${{ inputs.margin_pct }}"

      - name: Upload Matrix Reports & Artifacts
        if: always() && steps.check-run.outputs.run_job == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: batch-matrix-${{ matrix.symbol }}-${{ inputs.strategy }}-run${{ github.run_id }}
          path: |
            BACKTESTER/reports/${{ matrix.symbol }}_batch_matrix.csv
            BACKTESTER/reports/${{ matrix.symbol }}_batch_matrix.md
          if-no-files-found: warn
          retention-days: 30
