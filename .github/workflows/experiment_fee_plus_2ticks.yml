name: Experiment - OB Fee Coverage + 2 Ticks (Single Coin Deep Split)

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Trading Pair Symbol"
        required: true
        default: "BTC_USDT"
        type: choice
        options:
          - "BTC_USDT"
          - "TRUMP_USDT"
          - "1000000MOG_USDT"
          - "DOGE_USDT"
          - "ETH_USDT"
          - "SOL_USDT"
          - "XAU_USDT"
          - "XAG_USDT"
          - "CL_USDT"
          - "XRP_USDT"

      start_date:
        description: "Start Date (YYYY-MM-DD)"
        required: true
        default: "2026-01-01"
        type: string

      end_date:
        description: "End Date (YYYY-MM-DD)"
        required: true
        default: "2026-08-31"
        type: string

      extra_ticks:
        description: "Extra ticks beyond fee coverage"
        required: true
        default: "2"
        type: string

      capital:
        description: "Initial Capital in USDT"
        required: true
        default: "100.0"
        type: string

      leverage:
        description: "Leverage Multiplier"
        required: true
        default: "10"
        type: string

      margin_pct:
        description: "Margin Allocation % per trade (quantity = margin * leverage)"
        required: true
        default: "10.0"
        type: string

jobs:
  matrix-worker:
    name: Worker ${{ matrix.worker_id }}-${{ matrix.tag }} (${{ inputs.symbol }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1m Split (3 workers by fee schedule):
          # Fee 0 (Maker 0.00% / Taker 0.01%)
          - worker_id: "w01"
            tag: "1m_f0"
            timeframes: "1m"
            fee_indices: "0"
            slippage_ticks: "1,2,3,4,5,6,7"

          # Fee 1 (Maker 0.00% / Taker 0.05%)
          - worker_id: "w02"
            tag: "1m_f1"
            timeframes: "1m"
            fee_indices: "1"
            slippage_ticks: "1,2,3,4,5,6,7"

          # Fee 2 (Maker 0.10% / Taker 0.10%)
          - worker_id: "w03"
            tag: "1m_f2"
            timeframes: "1m"
            fee_indices: "2"
            slippage_ticks: "1,2,3,4,5,6,7"

          # 5m Split (3 workers by fee schedule):
          # Fee 0 (Maker 0.00% / Taker 0.01%)
          - worker_id: "w04"
            tag: "5m_f0"
            timeframes: "5m"
            fee_indices: "0"
            slippage_ticks: "1,2,3,4,5,6,7"

          # Fee 1 (Maker 0.00% / Taker 0.05%)
          - worker_id: "w05"
            tag: "5m_f1"
            timeframes: "5m"
            fee_indices: "1"
            slippage_ticks: "1,2,3,4,5,6,7"

          # Fee 2 (Maker 0.10% / Taker 0.10%)
          - worker_id: "w06"
            tag: "5m_f2"
            timeframes: "5m"
            fee_indices: "2"
            slippage_ticks: "1,2,3,4,5,6,7"

          # Higher Timeframes (1 worker): 15m, 1h, 4h, 1d (all fees & slippages)
          - worker_id: "w07"
            tag: "htf_all"
            timeframes: "15m,1h,4h,1d"
            fee_indices: "0,1,2"
            slippage_ticks: "1,2,3,4,5,6,7"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests websockets; fi

      - name: Cache Historical Market Data
        uses: actions/cache@v4
        with:
          path: BACKTESTER/OHLCV_Data_Binance
          key: experiment-data-${{ inputs.symbol }}-${{ matrix.tag }}-${{ inputs.start_date }}-${{ inputs.end_date }}
          restore-keys: |
            experiment-data-${{ inputs.symbol }}-${{ matrix.tag }}-
            experiment-data-${{ inputs.symbol }}-
            experiment-data-

      - name: Execute Experiment Worker Sweep
        run: |
          python experiments/ob_fee_plus_2ticks_experiment/run_experiment.py \
            --symbol "${{ inputs.symbol }}" \
            --timeframes "${{ matrix.timeframes }}" \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            --extra-ticks "${{ inputs.extra_ticks }}" \
            --capital "${{ inputs.capital }}" \
            --leverage "${{ inputs.leverage }}" \
            --margin-pct "${{ inputs.margin_pct }}" \
            --fee-indices "${{ matrix.fee_indices }}" \
            --slippage-ticks "${{ matrix.slippage_ticks }}" \
            --tag "${{ matrix.tag }}"

      - name: Upload Worker Chunk Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-chunk-${{ inputs.symbol }}-${{ matrix.tag }}
          path: |
            experiments/ob_fee_plus_2ticks_experiment/reports/${{ inputs.symbol }}_${{ matrix.tag }}_batch_matrix.csv
            experiments/ob_fee_plus_2ticks_experiment/reports/${{ inputs.symbol }}_${{ matrix.tag }}_batch_matrix.md
            experiments/ob_fee_plus_2ticks_experiment/reports/${{ inputs.symbol }}_${{ matrix.tag }}_trades.csv
          if-no-files-found: warn
          retention-days: 14

  consolidate:
    name: Consolidate ${{ inputs.symbol }} Reports
    needs: matrix-worker
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests websockets; fi

      - name: Download All Worker Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: exp-chunk-${{ inputs.symbol }}-*
          path: experiments/ob_fee_plus_2ticks_experiment/reports/
          merge-multiple: true

      - name: Run Master Consolidation
        run: |
          python experiments/ob_fee_plus_2ticks_experiment/run_experiment.py \
            --consolidate \
            --symbol "${{ inputs.symbol }}" \
            --reports-dir experiments/ob_fee_plus_2ticks_experiment/reports

      - name: Upload Final Consolidated Report Package
        uses: actions/upload-artifact@v4
        with:
          name: complete-experiment-reports-${{ inputs.symbol }}-run${{ github.run_id }}
          path: |
            experiments/ob_fee_plus_2ticks_experiment/reports/${{ inputs.symbol }}_batch_matrix.csv
            experiments/ob_fee_plus_2ticks_experiment/reports/${{ inputs.symbol }}_batch_matrix.md
            experiments/ob_fee_plus_2ticks_experiment/reports/${{ inputs.symbol }}_all_trades.csv
            experiments/ob_fee_plus_2ticks_experiment/reports/${{ inputs.symbol }}_*_trades.csv
            experiments/ob_fee_plus_2ticks_experiment/reports/${{ inputs.symbol }}_*_batch_matrix.csv
          if-no-files-found: warn
          retention-days: 30
