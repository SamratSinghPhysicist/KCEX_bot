name: Batch Train Shortlisted ML Pairs (Matrix)

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Select Pair Batch Suite"
        required: true
        default: "ALL_14_SHORTLISTED"
        type: choice
        options:
          - "ALL_14_SHORTLISTED"
          - "MAJORS_AND_DOGE"
          - "TOP_MOMENTUM_COINS"
          - "ALL_18_PAIRS"

      train_start_date:
        description: "Training Start Date (YYYY-MM-DD)"
        required: true
        default: "2025-06-01"
        type: string

      train_end_date:
        description: "Training End Date (YYYY-MM-DD)"
        required: true
        default: "2026-06-30"
        type: string

      test_start_date:
        description: "Out-of-Sample Test Start Date (YYYY-MM-DD)"
        required: true
        default: "2026-07-01"
        type: string

      test_end_date:
        description: "Out-of-Sample Test End Date (YYYY-MM-DD)"
        required: true
        default: "2026-08-31"
        type: string

      horizon_bars:
        description: "Horizon Bars (1m)"
        required: true
        default: "15"
        type: string

      tp_atr_mult:
        description: "TP ATR Multiplier"
        required: true
        default: "3.0"
        type: string

      sl_atr_mult:
        description: "SL ATR Multiplier"
        required: true
        default: "1.5"
        type: string

      confidence_threshold:
        description: "Confidence Threshold"
        required: true
        default: "0.40"
        type: string

jobs:
  resolve-matrix:
    name: Resolve Pair Matrix
    runs-on: ubuntu-latest
    outputs:
      symbols: ${{ steps.set-matrix.outputs.symbols }}
    steps:
      - id: set-matrix
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          echo "Selected Suite: $SUITE"
          SYMBOLS=$(python3 -c '
          import json, os
          suite = os.environ.get("SUITE", "ALL_14_SHORTLISTED")
          shortlisted_14 = [
              "MELANIAUSDT", "DOGSUSDT", "MEMEUSDT", "BOMEUSDT", "ACTUSDT",
              "AVAAIUSDT", "1000000MOGUSDT", "CHILLGUYUSDT", "GOATUSDT",
              "PIPPINUSDT", "WIFUSDT", "KOMAUSDT", "TRUMPUSDT", "AIXBTUSDT"
          ]
          majors = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "DOGEUSDT"]
          top_momentum = ["TRUMPUSDT", "DOGEUSDT", "MELANIAUSDT", "WIFUSDT", "GOATUSDT", "1000000MOGUSDT"]

          if suite == "ALL_14_SHORTLISTED":
              symbols = shortlisted_14
          elif suite == "MAJORS_AND_DOGE":
              symbols = majors
          elif suite == "TOP_MOMENTUM_COINS":
              symbols = top_momentum
          elif suite == "ALL_18_PAIRS":
              symbols = shortlisted_14 + [s for s in majors if s not in shortlisted_14]
          else:
              symbols = shortlisted_14

          print(json.dumps(symbols))
          ')
          echo "symbols=$SYMBOLS" >> $GITHUB_OUTPUT

  train-matrix-pair:
    name: Train ${{ matrix.symbol }}
    needs: resolve-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        symbol: ${{ fromJson(needs.resolve-matrix.outputs.symbols) }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Free Runner Disk Space for Deep Tick Trades
        run: |
          echo "Initial disk space:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/lib/jvm || true
          echo "Disk space after cleaning system bloatware:"
          df -h /

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (OpenMP)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Python ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ML_1M_MODEL/requirements.txt

      - name: Restore Aggregated Order Flow Parquet Cache
        uses: actions/cache@v4
        with:
          path: |
            ML_1M_MODEL/data_cache
          key: ml-parquet-${{ matrix.symbol }}-${{ inputs.train_start_date }}-${{ inputs.test_end_date }}
          restore-keys: |
            ml-parquet-${{ matrix.symbol }}-
            ml-parquet-

      - name: Execute End-to-End Training & Out-of-Sample Backtesting
        run: |
          echo "Training Matrix Target: ${{ matrix.symbol }}"
          rm -rf ML_1M_MODEL/reports/* ML_1M_MODEL/saved_models/*
          mkdir -p ML_1M_MODEL/reports ML_1M_MODEL/saved_models ML_1M_MODEL/data_cache

          python -m ML_1M_MODEL.run_pipeline \
            --symbol "${{ matrix.symbol }}" \
            --train-start "${{ inputs.train_start_date }}" \
            --train-end "${{ inputs.train_end_date }}" \
            --test-start "${{ inputs.test_start_date }}" \
            --test-end "${{ inputs.test_end_date }}" \
            --horizon "${{ inputs.horizon_bars }}" \
            --tp-mult "${{ inputs.tp_atr_mult }}" \
            --sl-mult "${{ inputs.sl_atr_mult }}" \
            --confidence "${{ inputs.confidence_threshold }}"

      - name: Publish Markdown Results to GitHub Step Summary
        if: always()
        run: |
          REPORT_FILE=$(ls -t ML_1M_MODEL/reports/*_oos_report.md 2>/dev/null | head -n 1)
          if [ -f "$REPORT_FILE" ]; then
            cat "$REPORT_FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ ML Model Run for ${{ matrix.symbol }} Incomplete" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Trained Model Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-model-${{ matrix.symbol }}-run${{ github.run_id }}
          path: |
            ML_1M_MODEL/saved_models/*
            ML_1M_MODEL/reports/*
          if-no-files-found: warn
          retention-days: 30
