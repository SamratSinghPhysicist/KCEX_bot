name: Forensic Audit - BTC/ETH Hedged Pairs Strategy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backtest Start Date (YYYY-MM-DD)"
        required: true
        default: "2020-01-01"
        type: string

      end_date:
        description: "Backtest End Date (YYYY-MM-DD)"
        required: true
        default: "2026-09-30"
        type: string

      capital:
        description: "Initial Capital in USD"
        required: true
        default: "1000.0"
        type: string

      leverage:
        description: "Max Platform Leverage"
        required: true
        default: "2.0"
        type: string

jobs:
  run-forensic-audit:
    name: Forensic Audit (${{ inputs.start_date || '2020-01-01' }} to ${{ inputs.end_date || '2026-09-30' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests

      - name: Run Forensic & Master Research Unit Tests
        run: |
          python -m unittest experiments/btc_eth_reverse_experiment/forensic_audit/test_forensic_audit.py
          python -m unittest experiments/btc_eth_reverse_experiment/forensic_audit/test_master_research_engine.py
          python -m unittest experiments/btc_eth_reverse_experiment/test_experiment.py

      - name: Download 2020-2026 Historical 1H & 1M Market Data
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python -c "
          import os
          from experiments.btc_eth_reverse_experiment.downloader import download_experiment_data
          s_date = os.environ.get('START_DATE') or '2020-01-01'
          e_date = os.environ.get('END_DATE') or '2026-09-30'
          if not s_date.strip(): s_date = '2020-01-01'
          if not e_date.strip(): e_date = '2026-09-30'
          print(f'Starting data download for {s_date} to {e_date}...')
          download_experiment_data(
              symbols=['BTCUSDT', 'ETHUSDT'],
              timeframes=['1h', '1m'],
              start_date=s_date,
              end_date=e_date,
              base_data_dir='BACKTESTER/OHLCV_Data_Binance',
              max_workers=16
          )
          "

      - name: Execute Master Research Suite (Phases 0 through 5)
        run: |
          python -u experiments/btc_eth_reverse_experiment/forensic_audit/master_research_engine.py

      - name: Execute Forensic Audit Baseline & Trade Forensic Logger
        run: |
          python -u experiments/btc_eth_reverse_experiment/forensic_audit/run_forensic_audit.py \
            --data-dir "BACKTESTER/OHLCV_Data_Binance" \
            --output-dir "experiments/btc_eth_reverse_experiment/reports"

      - name: Execute MFE TP1 & Breakeven Runner Experiment
        run: |
          python -u experiments/btc_eth_reverse_experiment/mfe_tp1_be_experiment.py

      - name: Publish Step Summary
        if: always()
        run: |
          if [ -f experiments/btc_eth_reverse_experiment/reports/MFE_TP1_BE_EXPERIMENT_REPORT.md ]; then
            cat experiments/btc_eth_reverse_experiment/reports/MFE_TP1_BE_EXPERIMENT_REPORT.md >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f experiments/btc_eth_reverse_experiment/reports/COMPREHENSIVE_RESEARCH_REPORT.md ]; then
            cat experiments/btc_eth_reverse_experiment/reports/COMPREHENSIVE_RESEARCH_REPORT.md >> $GITHUB_STEP_SUMMARY
          elif [ -f experiments/btc_eth_reverse_experiment/reports/EXPERIMENT_REPORT.md ]; then
            cat experiments/btc_eth_reverse_experiment/reports/EXPERIMENT_REPORT.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Experiment Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-systematic-research-artifacts
          path: |
            experiments/btc_eth_reverse_experiment/reports/*.csv
            experiments/btc_eth_reverse_experiment/reports/*.md
            COMPREHENSIVE_RESEARCH_REPORT.md
            MFE_TP1_BE_EXPERIMENT_REPORT.md
          retention-days: 30
