name: KCEX Dry-Run Trading (Simulated)

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Strategy Preset"
        required: false
        default: "TRUMP_ML_RAPID_SCALPER"
        type: choice
        options:
          - TRUMP_ML_RAPID_SCALPER
          - DOGE_ML_MOMENTUM
          - TRUMP_ORDER_BLOCK_DEMAND
          - DOGE_ORDER_BLOCK_DEMAND
          - CUSTOM
      symbol:
        description: "Trading pair symbol (used if CUSTOM preset)"
        required: false
        default: "TRUMP_USDT"
        type: string
      strategy:
        description: "Strategy Engine (used if CUSTOM preset)"
        required: false
        default: "ML_1M_MODEL"
        type: choice
        options:
          - ML_1M_MODEL
          - ORDER_BLOCK_DEMAND
          - STOCH_RSI
          - EMA_CROSSOVER
          - SMART_STRATEGY
      execution_style:
        description: "Execution style (PURE_MARKET or MAKER_HYBRID)"
        required: false
        default: "PURE_MARKET"
        type: choice
        options:
          - PURE_MARKET
          - MAKER_HYBRID
      volume_multiplier:
        description: "Volume multiplier (e.g. 1.0 for 1x min quantity)"
        required: false
        default: "1.0"
        type: string
      leverage:
        description: "Position leverage (default: 30x)"
        required: false
        default: "30"
        type: string
      runtime_hours:
        description: "Session runtime limit in hours (e.g. 0.1 for 6m, 1.0 for 1h, 3.5 for full session)"
        required: false
        default: "1.0"
        type: string
      max_trades:
        description: "Session trade target (0 = unlimited)"
        required: false
        default: "0"
        type: string
      cooldown_seconds:
        description: "Cooldown seconds between trades"
        required: false
        default: "10"
        type: string
      tp_ticks:
        description: "Take-Profit in price unit ticks (Fixed if not ML)"
        required: false
        default: "10"
        type: string
      sl_ticks:
        description: "Stop-Loss in price unit ticks (Fixed if not ML)"
        required: false
        default: "3"
        type: string
      invert_signal:
        description: "Signal Paradigm: Invert signal (Exhaustion Fading)"
        required: false
        default: false
        type: boolean
      enable_ratchet:
        description: "Enable Micro-Excursion Tick Ratchet"
        required: false
        default: false
        type: boolean

jobs:
  dry-run-trade:
    name: "🟢 Dry-Run (${{ inputs.preset || 'TRUMP_ML_RAPID_SCALPER' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: "📦 Checkout Code"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.13"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: "📥 Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "🟢 Run Dry-Run Simulated Trading Engine"
        env:
          KCEX_AUTH_TOKEN: ${{ secrets.KCEX_AUTH_TOKEN }}
          KCEX_USER_DEVICE: ${{ secrets.KCEX_USER_DEVICE }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          echo "::group::🔧 Engine Configuration"
          PRESET="${{ inputs.preset || 'TRUMP_ML_RAPID_SCALPER' }}"
          SYMBOL="${{ inputs.symbol || 'TRUMP_USDT' }}"
          STRATEGY="${{ inputs.strategy || 'ML_1M_MODEL' }}"
          TP_TICKS="${{ inputs.tp_ticks || '10' }}"
          SL_TICKS="${{ inputs.sl_ticks || '3' }}"
          VOL_MULT="${{ inputs.volume_multiplier || '1.0' }}"
          LEVERAGE="${{ inputs.leverage || '30' }}"
          COOLDOWN="${{ inputs.cooldown_seconds || '10' }}"
          MAX_TRADES="${{ inputs.max_trades || '0' }}"
          EXEC_STYLE="${{ inputs.execution_style || 'PURE_MARKET' }}"
          RUNTIME_HOURS="${{ inputs.runtime_hours || '1.0' }}"
          RUNTIME_SECONDS=$(python -c "print(int(float('${RUNTIME_HOURS}') * 3600))")

          # Signal Paradigm: Direct (default false) vs Inverted
          INVERT_FLAG="--no-invert-signal"
          if [ "${{ inputs.invert_signal }}" = "true" ]; then
            INVERT_FLAG="--invert-signal"
          fi

          # Tick Ratchet: Disabled (default false) vs Enabled
          RATCHET_FLAG="--no-ratchet"
          if [ "${{ inputs.enable_ratchet }}" = "true" ]; then
            RATCHET_FLAG="--ratchet"
          fi

          # Dynamic TP for ML vs Fixed TP for heuristic strategies
          TP_FLAG="--fixed-tp"
          if [ "${STRATEGY}" = "ML_1M_MODEL" ] || [ "${PRESET}" = "TRUMP_ML_RAPID_SCALPER" ] || [ "${PRESET}" = "DOGE_ML_MOMENTUM" ]; then
            TP_FLAG="--dynamic-tp"
          fi

          echo "Mode:              SIMULATED / DRY-RUN (Zero Risk)"
          echo "Preset:            ${PRESET}"
          echo "Symbol:            ${SYMBOL}"
          echo "Strategy Engine:   ${STRATEGY}"
          echo "Direction:         Autonomous (Bi-Directional)"
          echo "Execution Style:   ${EXEC_STYLE}"
          echo "Position Volume:   ${VOL_MULT}x min quantity"
          echo "Leverage:          ${LEVERAGE}x isolated"
          echo "Cooldown:          ${COOLDOWN}s"
          echo "Max Trades:        ${MAX_TRADES} (0 = unlimited)"
          echo "Runtime Limit:     ${RUNTIME_HOURS}h (${RUNTIME_SECONDS}s)"
          echo "Environment:       GitHub Actions (Run #${{ github.run_number }})"
          echo "::endgroup::"

          echo "::notice::🟢 Starting DRY-RUN simulated session: ${PRESET} | Style: ${EXEC_STYLE} | Runtime: ${RUNTIME_HOURS}h"

          if [ "${PRESET}" != "CUSTOM" ]; then
            python run_engine.py \
              --non-interactive \
              --mode dry-run \
              --preset "${PRESET}" \
              --execution-style "${EXEC_STYLE}" \
              --volume-multiplier "${VOL_MULT}" \
              --max-trades "${MAX_TRADES}" \
              --runtime-limit "${RUNTIME_SECONDS}"
          else
            python run_engine.py \
              --non-interactive \
              --mode dry-run \
              --symbol "${SYMBOL}" \
              --strategy "${STRATEGY}" \
              --stoch-preset FAST_SCALP \
              --bi-directional \
              ${INVERT_FLAG} \
              --volume-mode MULTIPLIER \
              --volume-multiplier "${VOL_MULT}" \
              --tp-ticks "${TP_TICKS}" \
              ${TP_FLAG} \
              --sl-mode TICKS \
              --sl-ticks "${SL_TICKS}" \
              --leverage "${LEVERAGE}" \
              --execution-style "${EXEC_STYLE}" \
              ${RATCHET_FLAG} \
              --disable-slippage \
              --cooldown "${COOLDOWN}" \
              --max-trades "${MAX_TRADES}" \
              --runtime-limit "${RUNTIME_SECONDS}"
          fi

          echo "::notice::✅ Dry-Run simulated trading session completed"

      - name: "📊 Session Summary"
        if: always()
        run: |
          echo "## 🟢 Dry-Run Session Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "logs/trade_outcomes.txt" ]; then
            echo "### Simulated Trade Outcomes Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 logs/trade_outcomes.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "> No trade outcomes recorded in this dry-run session." >> $GITHUB_STEP_SUMMARY
          fi

      - name: "📁 Upload Session Logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-session-${{ inputs.preset || 'TRUMP_ML_RAPID_SCALPER' }}-run${{ github.run_number }}-${{ github.run_id }}
          path: |
            logs/*.log
            logs/*.txt
            logs/*.jsonl
          if-no-files-found: warn
          retention-days: 90
